  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: stockprice-backend-config
    namespace: stockprice
  data:
    ASPNETCORE_ENVIRONMENT: "Production"
    Finnhub__FetchIntervalHours: "6"
    StockPrice__GaugeHeartbeatMinutes: "15"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stockprice-backend-pdb
  namespace: stockprice
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stockprice-backend
      namespace: stockprice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-backend
  namespace: stockprice
  labels:
    app: stockprice-backend
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "stock-price-api"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-backend
  template:
    metadata:
      labels:
        app: stockprice-backend
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "stock-price-api"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/stockprice-backend.check_names: '["aspdotnet"]'
        ad.datadoghq.com/stockprice-backend.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-backend.instances: '[{"host": "%%host%%", "port": 80}]'
        # Container stdout/stderr (Serilog WriteTo.Console). File tailing inside the pod is brittle on K8s; JSON files remain for Docker volume shipping.
        # JSON on stdout (Serilog); env at top-level helps Logs ↔ Traces correlation in the UI
        ad.datadoghq.com/stockprice-backend.logs: '[{"source":"csharp","service":"stock-price-api","tags":["env:production","version:1.0.0","sourcecategory:sourcecode"]}]'
        ad.datadoghq.com/stockprice-backend.apm: 'true'
        admission.datadoghq.com/enabled: "true"
    spec:
      containers:
        - name: stockprice-backend
          image: dotnetapmdev.azurecr.io/stockprice-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: stockprice-backend-config
          env:
            # Admission injects DD_TRACE_AGENT_URL=unix:///var/run/datadog/apm.socket; on Docker Desktop + .NET
            # the managed tracer often fails UDS (EADDRNOTAVAIL) and never reaches the agent. TCP to the in-cluster
            # Agent service works and restores APM (RUM is unrelated—it sends straight to Datadog from the browser).
            - name: DD_TRACE_AGENT_URL
              value: "http://datadog.datadog.svc.cluster.local:8126"
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "stock-price-api"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED
              value: "true"
            - name: DD_TRACE_PROPAGATION_STYLE
              value: "Datadog"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
            # DogStatsd custom metrics (e.g. stock_price.latest). Point at Agent service UDP port.
            - name: DOGSTATSD_HOST
              value: datadog.datadog.svc.cluster.local
            - name: DOGSTATSD_PORT
              value: "8125"
            # Real quotes: https://www.alphavantage.co/support/#api-key — set via secret in production.
            - name: FINNHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockprice-secrets
                  key: finnhub-api-key
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /api/stockprice/competitors
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: app-logs
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-frontend
  namespace: stockprice
  labels:
    app: stockprice-frontend
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "stock-price-frontend"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-frontend
  template:
    metadata:
      labels:
        app: stockprice-frontend
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "stock-price-frontend"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/stockprice-frontend.check_names: '["nginx"]'
        ad.datadoghq.com/stockprice-frontend.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-frontend.instances: '[{"host": "%%host%%", "port": 80}]'
        ad.datadoghq.com/stockprice-frontend.logs: '[{"source":"nginx","service":"stock-price-frontend","tags":["env:production","version:1.0.0"]}]'
        admission.datadoghq.com/enabled: "true"
        admission.datadoghq.com/js-lib.version: "latest"
    spec:
      containers:
        - name: stockprice-frontend
          image: dotnetapmdev.azurecr.io/stockprice-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "stock-price-frontend"
            - name: DD_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-db
  namespace: stockprice
  labels:
    app: stockprice-db
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "stockprice-sqlserver"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-db
  template:
    metadata:
      labels:
        app: stockprice-db
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "stockprice-sqlserver"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/stockprice-db.check_names: '["sqlserver"]'
        ad.datadoghq.com/stockprice-db.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-db.instances: '[{"host": "%%host%%", "port": 1433}]'
        ad.datadoghq.com/stockprice-db.logs: '[{"source":"sqlserver","service":"stockprice-sqlserver","tags":["env:production"]}]'
    spec:
      containers:
        - name: stockprice-db
          image: mcr.microsoft.com/mssql/server
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockprice-secrets
                  key: sa-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-backend-service
  namespace: stockprice
spec:
  selector:
    app: stockprice-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-frontend-service
  namespace: stockprice
spec:
  selector:
    app: stockprice-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-db-service
  namespace: stockprice
spec:
  selector:
    app: stockprice-db
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
  type: ClusterIP
---
  apiVersion: datadoghq.com/v1alpha1
  kind: DatadogMetric
  metadata:
    name: stock-price-ddog
    namespace: stockprice
  spec:
    query: avg:stock_price.latest{symbol:ddog}
---
  apiVersion: autoscaling/v2
  kind: HorizontalPodAutoscaler
  metadata:
    name: stockprice-backend-hpa
    namespace: stockprice
  spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: stockprice-backend
    minReplicas: 1
    maxReplicas: 3
    metrics:
      - type: External
        external:
          metric:
            name: datadogmetric@stockprice:stock-price-ddog
          target:
            type: AverageValue
            averageValue: "50"