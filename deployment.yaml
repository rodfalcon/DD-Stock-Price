apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-backend
  labels:
    app: stockprice-backend
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "stock-price-api"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-backend
  template:
    metadata:
      labels:
        app: stockprice-backend
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "stock-price-api"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/stockprice-backend.check_names: '["aspdotnet"]'
        ad.datadoghq.com/stockprice-backend.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-backend.instances: '[{"host": "%%host%%", "port": 80}]'
        # Container stdout/stderr (Serilog WriteTo.Console). File tailing inside the pod is brittle on K8s; JSON files remain for Docker volume shipping.
        # JSON on stdout (Serilog); env at top-level helps Logs ↔ Traces correlation in the UI
        ad.datadoghq.com/stockprice-backend.logs: '[{"source":"csharp","service":"stock-price-api","env":"production","version":"1.0.0","tags":["sourcecategory:sourcecode"]}]'
        ad.datadoghq.com/stockprice-backend.apm: 'true'
        admission.datadoghq.com/enabled: "true"
        admission.datadoghq.com/dotnet-lib.version: "latest"
    spec:
      containers:
        - name: stockprice-backend
          image: stockprice-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Admission injects DD_TRACE_AGENT_URL=unix:///var/run/datadog/apm.socket; on Docker Desktop + .NET
            # the managed tracer often fails UDS (EADDRNOTAVAIL) and never reaches the agent. TCP to the in-cluster
            # Agent service works and restores APM (RUM is unrelated—it sends straight to Datadog from the browser).
            - name: DD_TRACE_AGENT_URL
              value: "http://datadog.datadog.svc.cluster.local:8126"
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "stock-price-api"
            - name: DD_VERSION
              value: "1.0.0"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-frontend
  labels:
    app: stockprice-frontend
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "stock-price-frontend"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-frontend
  template:
    metadata:
      labels:
        app: stockprice-frontend
        tags.datadoghq.com/env: "production"
        tags.datadoghq.com/service: "stock-price-frontend"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/stockprice-frontend.check_names: '["nginx"]'
        ad.datadoghq.com/stockprice-frontend.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-frontend.instances: '[{"host": "%%host%%", "port": 80}]'
        ad.datadoghq.com/stockprice-frontend.logs: '[{"source":"nginx","service":"stock-price-frontend","env":"production","version":"1.0.0"}]'
        admission.datadoghq.com/enabled: "true"
        admission.datadoghq.com/js-lib.version: "latest"
    spec:
      containers:
        - name: stockprice-frontend
          image: stockprice-frontend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "stock-price-frontend"
            - name: DD_VERSION
              value: "1.0.0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockprice-db
  labels:
    app: stockprice-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockprice-db
  template:
    metadata:
      labels:
        app: stockprice-db
      annotations:
        ad.datadoghq.com/stockprice-db.check_names: '["sqlserver"]'
        ad.datadoghq.com/stockprice-db.init_configs: '[{}]'
        ad.datadoghq.com/stockprice-db.instances: '[{"host": "%%host%%", "port": 1433}]'
        ad.datadoghq.com/stockprice-db.logs: '[{"source": "sqlserver"}]'
        ad.datadoghq.com/stockprice-db.tags: '[{"env": "production"}]'
    spec:
      containers:
        - name: stockprice-db
          image: mcr.microsoft.com/mssql/server
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              value: "YourStrong!Passw0rd"

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-backend-service
spec:
  selector:
    app: stockprice-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-frontend-service
spec:
  selector:
    app: stockprice-frontend
  ports:
    # Docker Desktop: LoadBalancer is published on localhost at this port (no port-forward).
    # Standard cloud clusters need a real LB or use NodePort / Ingress instead.
    - protocol: TCP
      port: 8080
      targetPort: 80
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: stockprice-db-service
spec:
  selector:
    app: stockprice-db
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
  type: ClusterIP
